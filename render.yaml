services:
  - type: web
    name: kfc-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: ADMIN_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: ADMIN_CHAT_ID
        sync: false
      - key: COURIER_CHAT_ID
        sync: false
      - key: BOT_TOKEN
        sync: false
